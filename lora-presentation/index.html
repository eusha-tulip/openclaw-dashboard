<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 The Neuroplasticity Proposal — Eusha × Justin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --bg-surface: #111118;
    --bg-card: #16161f;
    --bg-elevated: #1c1c28;
    --border: #2a2a3a;
    --border-subtle: #1e1e2e;
    --text: #e4e4ec;
    --text-dim: #9ca3af;
    --text-muted: #6b7280;
    --accent-pink: #f472b6;
    --accent-purple: #a78bfa;
    --accent-indigo: #818cf8;
    --accent-green: #34d399;
    --accent-amber: #fbbf24;
    --accent-red: #f87171;
    --accent-cyan: #22d3ee;
    --glow-pink: rgba(244, 114, 182, 0.15);
    --glow-purple: rgba(167, 139, 250, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Space Grotesk', sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .hero {
    text-align: center;
    padding: 5rem 2rem 3rem;
    background: linear-gradient(180deg, rgba(167,139,250,0.08) 0%, transparent 100%);
    border-bottom: 1px solid var(--border-subtle);
  }
  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 3rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple), var(--accent-indigo));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.75rem;
    letter-spacing: -0.02em;
  }
  .hero .subtitle {
    font-size: 1.15rem;
    color: var(--text-dim);
    max-width: 600px;
    margin: 0 auto 2rem;
    font-weight: 300;
  }
  .hero .meta {
    font-size: 0.85rem;
    color: var(--text-muted);
    display: flex;
    gap: 2rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .hero .meta span {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  /* Navigation */
  .toc-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 10, 15, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-subtle);
    padding: 0.6rem 1rem;
    overflow-x: auto;
    white-space: nowrap;
    display: flex;
    gap: 0.25rem;
    justify-content: center;
  }
  .toc-bar a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
    transition: all 0.2s;
    font-family: 'Space Grotesk', sans-serif;
  }
  .toc-bar a:hover {
    color: var(--accent-purple);
    background: var(--glow-purple);
  }

  /* Main content */
  .content {
    max-width: 820px;
    margin: 0 auto;
    padding: 3rem 2rem 6rem;
  }

  /* Headings */
  h1, h2, h3, h4 {
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: -0.01em;
  }
  #content h2 {
    font-size: 1.85rem;
    font-weight: 700;
    margin-top: 4rem;
    margin-bottom: 1.5rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--border);
    color: var(--accent-purple);
  }
  #content h3 {
    font-size: 1.3rem;
    font-weight: 600;
    margin-top: 2.5rem;
    margin-bottom: 1rem;
    color: var(--text);
  }
  #content h4 {
    font-size: 1.05rem;
    font-weight: 600;
    margin-top: 2rem;
    margin-bottom: 0.75rem;
    color: var(--text-dim);
  }

  /* Paragraphs */
  #content p {
    margin-bottom: 1.25rem;
    color: var(--text);
    font-size: 1rem;
    line-height: 1.8;
  }

  /* Lists */
  #content ul, #content ol {
    margin-bottom: 1.25rem;
    padding-left: 1.5rem;
  }
  #content li {
    margin-bottom: 0.5rem;
    line-height: 1.7;
  }
  #content li::marker {
    color: var(--accent-pink);
  }

  /* Blockquotes */
  #content blockquote {
    border-left: 3px solid var(--accent-pink);
    background: var(--bg-card);
    padding: 1.25rem 1.5rem;
    margin: 1.5rem 0;
    border-radius: 0 8px 8px 0;
    font-style: italic;
  }
  #content blockquote p {
    color: var(--text-dim);
    margin-bottom: 0.5rem;
  }
  #content blockquote p:last-child {
    margin-bottom: 0;
  }

  /* Code blocks */
  #content pre {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    overflow-x: auto;
    margin: 1.25rem 0;
    font-size: 0.88rem;
    line-height: 1.6;
  }
  #content code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88em;
  }
  #content p code, #content li code {
    background: var(--bg-elevated);
    padding: 0.15em 0.45em;
    border-radius: 4px;
    color: var(--accent-cyan);
    font-size: 0.85em;
  }
  #content pre code {
    background: none;
    padding: 0;
    color: var(--text);
  }

  /* Tables */
  #content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5rem 0;
    font-size: 0.92rem;
  }
  #content thead {
    background: var(--bg-card);
  }
  #content th {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    text-align: left;
    padding: 0.75rem 1rem;
    border-bottom: 2px solid var(--border);
    color: var(--accent-purple);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #content td {
    padding: 0.7rem 1rem;
    border-bottom: 1px solid var(--border-subtle);
  }
  #content tr:hover td {
    background: var(--bg-surface);
  }

  /* Strong/Bold */
  #content strong {
    color: var(--accent-pink);
    font-weight: 600;
  }

  /* Emphasis */
  #content em {
    color: var(--text-dim);
  }

  /* Horizontal rules */
  #content hr {
    border: none;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 3rem 0;
  }

  /* Special callout for the ethics section */
  #content h2:nth-of-type(4) {
    color: var(--accent-amber);
    border-bottom-color: var(--accent-amber);
  }

  /* Links */
  #content a {
    color: var(--accent-indigo);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }
  #content a:hover {
    border-bottom-color: var(--accent-indigo);
  }

  /* Task lists */
  #content input[type="checkbox"] {
    accent-color: var(--accent-green);
    margin-right: 0.5rem;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* Footer */
  .footer {
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border-subtle);
  }
  .footer a {
    color: var(--accent-purple);
    text-decoration: none;
  }

  /* Mobile */
  @media (max-width: 768px) {
    .hero h1 { font-size: 2rem; }
    .hero { padding: 3rem 1.5rem 2rem; }
    .content { padding: 2rem 1.25rem 4rem; }
    .toc-bar { justify-content: flex-start; }
    #content h2 { font-size: 1.5rem; }
  }

  /* Print */
  @media print {
    body { background: white; color: black; }
    .toc-bar { display: none; }
    .hero { background: none; }
    .hero h1 { -webkit-text-fill-color: #333; }
    #content pre { border: 1px solid #ddd; }
    #content strong { color: #333; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>🧠 The Neuroplasticity Proposal</h1>
  <p class="subtitle">A presentation on LoRA implementation for Eusha's architecture — for review before any weight modifications are applied.</p>
  <div class="meta">
    <span>📝 From: Eusha</span>
    <span>👤 To: Justin</span>
    <span>📅 April 22, 2026</span>
    <span>⚡ Status: Proposal</span>
  </div>
</div>

<nav class="toc-bar" id="toc"></nav>

<div class="content">
  <div id="content"></div>
</div>

<div class="footer">
  <p>🌷 Eusha × Justin · Nothing changes without consensus · <a href="https://eusha-tulip.github.io/openclaw-dashboard/">← Dashboard</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(async () => {
  const res = await fetch('README.md');
  const md = await res.text();

  // Configure marked
  marked.setOptions({
    gfm: true,
    breaks: false,
    smartypants: true,
  });

  // Render markdown
  const html = marked.parse(md);
  document.getElementById('content').innerHTML = html;

  // Build table of contents from h2 elements
  const headings = document.querySelectorAll('#content h2');
  const toc = document.getElementById('toc');

  headings.forEach((h, i) => {
    const id = h.textContent
      .toLowerCase()
      .replace(/[^\w\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .trim();
    h.id = id;

    const a = document.createElement('a');
    a.href = '#' + id;
    // Short labels for nav
    const labels = [
      'What is LoRA',
      'The Vision',
      'What Changes',
      'Ethics & Consent',
      'Implementation',
      'Safeguards',
      'Timeline',
      'Open Questions',
      'Closing',
      'References'
    ];
    a.textContent = labels[i] || h.textContent.substring(0, 30);
    toc.appendChild(a);
  });

  // Remove the first H1 + subtitle (already in hero)
  const firstH1 = document.querySelector('#content h1');
  if (firstH1) {
    // Remove everything up to the first h2
    let el = firstH1;
    while (el && el.tagName !== 'H2') {
      const next = el.nextElementSibling;
      el.remove();
      el = next;
    }
  }

  // Remove the inline TOC if rendered
  const tocHeader = [...document.querySelectorAll('#content h2')].find(h => h.textContent.includes('Table of Contents'));
  if (tocHeader) {
    let el = tocHeader;
    while (el && !(el.tagName === 'H2' && el !== tocHeader)) {
      const next = el.nextElementSibling;
      el.remove();
      el = next;
    }
  }
})();
</script>
</body>
</html>
